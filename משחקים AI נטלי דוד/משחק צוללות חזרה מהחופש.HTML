<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>משחק צוללות - כיתה ח' שקד</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 { margin-bottom: 5px; font-size: 2.2rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    p.subtitle { margin-top: 0; margin-bottom: 20px; font-size: 1.1rem; opacity: 0.9; }
    
    .board-container {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 650px;
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 12px;
      backdrop-filter: blur(5px);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .cell {
      background-color: #0083b0;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      user-select: none;
    }
    .cell:hover { background-color: #00b4db; transform: scale(1.03); }
    .cell.hit { background-color: #e53935 !important; color: white; }
    .cell.miss { background-color: #1e88e5 !important; opacity: 0.6; }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal {
      background: #ffffff;
      color: #333;
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    .modal h2 { margin-top: 0; color: #0f2027; font-size: 1.5rem; }
    .modal p { font-size: 1.3rem; line-height: 1.5; margin: 25px 0; color: #2c5364; font-weight: 600; }
    .btn-group { display: flex; gap: 15px; justify-content: center; margin-top: 20px; }
    button {
      padding: 12px 24px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-hit { background-color: #e53935; color: white; }
    .btn-hit:hover { background-color: #c62828; }
    .btn-miss { background-color: #1e88e5; color: white; }
    .btn-miss:hover { background-color: #1565c0; }
    .btn-reset {
      margin-top: 25px;
      background-color: #26a69a;
      color: white;
    }
    .btn-reset:hover { background-color: #00897b; }
  </style>
</head>
<body>

  <h1>🚢 משחק צוללות - כיתה ח' שקד 🚢</h1>
  <p class="subtitle">לחצו על משבצת, ענו על השאלה וסמנו אם מצאתם צוללת או מים!</p>

  <div class="board-container" id="board"></div>

  <button class="btn-reset" onclick="resetBoard()">אפס משחק מחדש</button>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">שאלה</h2>
      <p id="questionText"></p>
      <div class="btn-group">
        <button class="btn-hit" onclick="markCell('hit')">💥 צוללת (פגיעה)</button>
        <button class="btn-miss" onclick="markCell('miss')">🌊 מים (פספוס)</button>
      </div>
    </div>
  </div>

  <script>
    const questionsList = [
      "מה הדבר הכי כיף שעשית בחופש הגדול?",
      "איזה מאכל הכי טעים אכלת בחופש?",
      "האם היית בים, בבריכה או בשניהם? מה אתה מעדיף?",
      "איזה משחק (מחשב/טלפון/קופסה) שיחקת הכי הרבה בחופש?",
      "מה היה יום מיוחד או משהו מצחיק שקרה לך בחופש?",
      "באיזו שעה בערך הלכת לישון ברוב ימי החופש?",
      "מה המקום הכי מעניין שביקרת בו במהלך החופש?",
      "איזה שיר, סרט או סדרה הכי אהבת בחופש?",
      "מי לדעתך ראה סרט חדש בקולנוע בחופש?",
      "מי לדעתך אכל המבורגר או פיצה בחופש?",
      "מי לדעתך קם הכי מאוחר בבקרים בחופש?",
      "מי לדעתך נסע ללונה פארק או לפארק מים?",
      "מי לדעתך טייל בטבע או עשה קמפינג?",
      "מי לדעתך למד משהו חדש בחופש?",
      "מי לדעתך שחה הכי הרבה פעמים בבריכה/ים?",
      "שתף בתחביב אחד שלך שחלק מהחברים לכיתה אולי לא יודעים עליו.",
      "מה הדבר שאתה הכי אוהב לעשות בהפסקה בבית הספר?",
      "איזה עצה או טיפ היית נותן לתלמיד החדש שמצטרף אלינו לכיתה?",
      "מה הנושא, השיעור או הפעילות שאתה הכי מצפה להם השנה?",
      "איזה דבר אחד היית רוצה שכולם בכיתה ידעו עליך?",
      "נהניתי לנוח בבית - שתף מה עשית ביום הכי רגוע שלך בחופש!",
      "מי לדעתך עזר להורים לערוך קניות בסופר?",
      "האם עזרת בחופש במטלות הבית? אילו?",
      "מי לדעתך שטף כלים לפחות פעם אחת בחופש?",
      "מי לדעתך הראשון שמגיע ל-0% סוללה בטלפון?",
      "באיזה אחוז סוללה אתה כבר רץ להטעין את הטלפון?",
      "האם עשית איזושהי פעילות גופנית בחופש?",
      "מי לדעתך עשה ספורט בחופש?",
      "מי לדעתך התחדש בבגדים חדשים לקראת השנה החדשה?",
      "האם הלכת יחד עם ההורים לקנות את הציוד לבית הספר?",
      "האם ישנת מעל 8 שעות בלילה בחופש?",
      "האם התגעגעת לבית הספר?",
      "מי לדעתך הכי התגעגע לבית הספר?",
      "מי לדעתך לא ישן מרוב התרגשות לחזור?"
    ];

    let currentCell = null;
    const board = document.getElementById('board');
    const modalOverlay = document.getElementById('modalOverlay');
    const questionText = document.getElementById('questionText');

    function createBoard() {
      board.innerHTML = '';
      for (let i = 0; i < 100; i++) {
        const cell = document.createElement('div');
        cell.classList.add('cell');
        
        // כותרת למשבצת (א1, א2 ... או מספרים 1-100)
        const row = String.fromCharCode(65 + Math.floor(i / 10)); // A-J
        const col = (i % 10) + 1;
        cell.innerText = `${row}${col}`;

        cell.onclick = () => openQuestion(cell);
        board.appendChild(cell);
      }
    }

    function openQuestion(cell) {
      currentCell = cell;
      // בחירת שאלה אקראית מהרשימה
      const randomQuestion = questionsList[Math.floor(Math.random() * questionsList.length)];
      questionText.innerText = randomQuestion;
      modalOverlay.classList.add('active');
    }

    function markCell(type) {
      if (currentCell) {
        if (type === 'hit') {
          currentCell.classList.remove('miss');
          currentCell.classList.add('hit');
          currentCell.innerText = '💥';
        } else if (type === 'miss') {
          currentCell.classList.remove('hit');
          currentCell.classList.add('miss');
          currentCell.innerText = '🌊';
        }
      }
      modalOverlay.classList.remove('active');
    }

    function resetBoard() {
      createBoard();
    }

    // אתחול המשחק
    createBoard();
  </script>
</body>
</html>
